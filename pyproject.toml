[project]
name = "attest"
version = "0.0.1"
description = "Groundedness auditor: verifies AI agents' claims about data against DataHub's catalog as ground truth."
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "seed", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
