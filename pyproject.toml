[project]
name = "attest"
version = "0.0.1"
description = "Groundedness auditor: verifies AI agents' claims about data against DataHub's catalog as ground truth."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    # FLOORED, and the floor is load-bearing rather than cosmetic. app.py uses
    # `status.HTTP_422_UNPROCESSABLE_CONTENT`, which starlette only grew in 0.47.0 (the older
    # spelling `..._ENTITY` is now deprecated — do NOT switch back to it). fastapi>=0.115 alone
    # has no ceiling but the 0.115.x line pins starlette<0.47, so a resolver landing on the
    # DECLARED FLOOR (not the newest resolve CI happens to get) imports a starlette without the
    # symbol and dies with AttributeError on the target_urns 422 path — which an OFFLINE test
    # exercises. Pinning starlette>=0.47 here forces fastapi>=0.116 by backtracking, so the
    # symbol is present at the floor and not merely in requirements.lock.
    "starlette>=0.47",
    "httpx>=0.28",
    "langgraph>=1.0",
    # PINNED, not floored. This is a separate distribution on its own release cadence
    # against langgraph>=1.0 — it has already been through three major versions of its own
    # — and it owns the tables a PARKED RUN is resumed from. A minor bump that reshapes
    # them turns "approve this correction" into a 409 for every run parked before the
    # upgrade, and the audit would look fine right up until someone tried to sign it off.
    # Bump it deliberately, with tests/test_resume.py green, or not at all.
    "langgraph-checkpoint-sqlite==3.1.0",
    "openai>=2.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.14",
    "uvicorn>=0.34",
    # Use the OS certificate store: certifi alone fails behind a TLS-inspecting
    # network, which is not an outage and not a bad key. See llm.py.
    "truststore>=0.10",
]

[project.optional-dependencies]
# pytest-xdist parallelizes the OFFLINE suite across cores (`-n auto`, wired into `just
# test`/`just check`). The live suite stays serial -- it writes to a shared catalog, and
# conftest.py refuses to run it under parallel workers. See tests/conftest.py.
#
# `dev` pulls in `bench` because the OFFLINE tier imports it: tests/test_benchmark.py imports
# benchmark.run_eval, which imports sklearn.metrics. That test is `not live and not
# integration`, so it is part of the CI gate -- and CI installs `.[dev]` (`just setup`). If
# sklearn is only in `bench`, CI collection dies with ModuleNotFoundError while every test
# passes on a machine that happens to have it: the "green on my machine" trap this repo keeps
# hitting. Depending on `attest[bench]` keeps sklearn OUT of the runtime `dependencies` (the
# service still does not ship it) while guaranteeing the tier that imports it can install it.
# ruff is PINNED exact, not floored. The lint gate is part of CI (`just check`), and ruff's
# rule set moves between releases -- a rule can be added, deprecated, or removed (UP038, which
# once flagged `isinstance(x, (int, float))`, was removed outright by 0.15). An unpinned floor
# means the same tree lints clean on one machine and red on another with no code change: the
# "green on my machine" trap this repo keeps hitting. Bump it deliberately, with `ruff check .`
# clean, or not at all.
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff==0.15.21", "attest[bench]"]
# The benchmark's metrics. sklearn, not a hand-rolled count: the arithmetic of a metric is
# exactly where a quiet off-by-one produces a plausible number that is wrong, and a
# benchmark's own arithmetic is the last thing that should be bespoke. NOT a runtime
# dependency -- nothing in src/attest imports it, and the service does not ship it. Pulled
# into `dev` above because the offline test tier (test_benchmark.py) imports it.
bench = ["scikit-learn>=1.5"]
# The browser verifications: the E2E (tests/test_e2e_browser.py, `just e2e`) and the replay
# check (`just replay-verify`). DELIBERATELY NOT IN `dev`, and that is the whole point of it
# being its own extra: the `check` JOB installs `.[dev]` and runs `just check`, which is
# `-m 'not live and not integration'`, so nothing in the CI-gated Python tier imports
# playwright. `dev` deliberately does NOT depend on `attest[e2e]` -- the opposite of the
# `bench` reasoning above.
#
# AMENDED (§24): the comment here used to say this extra "must never be something CI tries to
# install or run". CI now installs it, in the `frontend` job, to run `just replay-verify` --
# and the distinction the old sentence was missing is between the two things this extra
# serves. `just e2e` still must never be in CI: it needs a real DataHub, a real model and a
# real catalog write. `just replay-verify` needs a directory and a browser, which is why it
# could move and the E2E could not.
#
# PINNED EXACT, same reasoning as ruff: playwright's driver protocol and its browser
# expectations move between releases, and a floating floor means the same tree drives a
# browser on one machine and dies on another with no code change.
#
# NO BROWSER DOWNLOAD -- LOCALLY. The tests drive INSTALLED Microsoft Edge
# (`channel="msedge"`), so `playwright install` is never run here and cdn.playwright.dev is
# never contacted. That is not a preference -- Playwright's downloader is its bundled NODE
# driver, which would need NODE_USE_SYSTEM_CA=1 on a TLS-inspecting network (CLAUDE.md's
# system-CA table, row 2), and the whole class of problem is avoided by not downloading
# anything. The cost, named: the browser is then whatever Edge the machine has, and Edge
# auto-updates. Pinning playwright does not pin the browser. Measured green against Edge
# 150.0.4078.65.
#
# CI DOES download one, and only for the replay check: there is no corporate CA on a runner
# and no Edge to assume, so `ATTEST_BROWSER_CHANNEL=""` selects playwright's own Chromium,
# whose version this pin DOES fix. Both browsers are measured green (§24).
e2e = ["playwright==1.61.0"]
# Catalog DISCOVERY over the DataHub MCP Server (§22). The picker's live search, and the
# `spikes/mcp_reader_probe.py` evaluation that decided the catalog read stays on GraphQL.
#
# DELIBERATELY NOT IN `dev`, the same reasoning as `e2e`: CI installs `.[dev]` and runs `just
# check`, and discovery is an optional convenience that must never become something CI
# installs or a subprocess CI spawns. The offline tier is RUN with `mcp` unimportable to prove
# it -- 482 passed, 0 skipped, with the module hidden.
#
# This is the CLIENT only. The server itself is fetched by `uvx` at first use
# (ATTEST_MCP_COMMAND), which keeps a 100+ MB DataHub SDK tree out of Attest's dependency
# closure for a feature that answers a text box -- and keeps the launch recipe identical to
# the one Session 17's evaluation measured against.
#
# FLOORED, not pinned: this is a protocol client whose stdio transport is stable, and the
# thing it talks to is version-gated on its own (`just discover` is the tripwire that says so).
mcp = ["mcp>=1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "seed", "spikes", "tests", "benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is on the path so `from conftest import DOCUMENTED` works: the seeded URNs
# are a shared vocabulary, and naming them by the role they play beats repeating URN
# literals in every assertion.
pythonpath = ["tests"]
# Live tests hit the real OpenAI API and cost money, so they are deselected by default.
# `just live` runs them. The default selection still includes the INTEGRATION tier (live
# GMS, no model cost); `just check`/CI narrows further to `not live and not integration`.
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: real OpenAI model AND/OR the anti-drift pin against live GMS. Costs money / needs a catalog. Run with `just live`.",
    "integration: needs a live DataHub server (wire format, structured-property fabrication). No model cost, but not offline. Skips LOUDLY when DataHub is down.",
]
