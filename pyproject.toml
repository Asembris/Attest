[project]
name = "attest"
version = "0.0.1"
description = "Groundedness auditor: verifies AI agents' claims about data against DataHub's catalog as ground truth."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "langgraph>=1.0",
    # PINNED, not floored. This is a separate distribution on its own release cadence
    # against langgraph>=1.0 — it has already been through three major versions of its own
    # — and it owns the tables a PARKED RUN is resumed from. A minor bump that reshapes
    # them turns "approve this correction" into a 409 for every run parked before the
    # upgrade, and the audit would look fine right up until someone tried to sign it off.
    # Bump it deliberately, with tests/test_resume.py green, or not at all.
    "langgraph-checkpoint-sqlite==3.1.0",
    "openai>=2.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.14",
    "uvicorn>=0.34",
    # Use the OS certificate store: certifi alone fails behind a TLS-inspecting
    # network, which is not an outage and not a bad key. See llm.py.
    "truststore>=0.10",
]

[project.optional-dependencies]
# pytest-xdist parallelizes the OFFLINE suite across cores (`-n auto`, wired into `just
# test`/`just check`). The live suite stays serial -- it writes to a shared catalog, and
# conftest.py refuses to run it under parallel workers. See tests/conftest.py.
#
# `dev` pulls in `bench` because the OFFLINE tier imports it: tests/test_benchmark.py imports
# benchmark.run_eval, which imports sklearn.metrics. That test is `not live and not
# integration`, so it is part of the CI gate -- and CI installs `.[dev]` (`just setup`). If
# sklearn is only in `bench`, CI collection dies with ModuleNotFoundError while every test
# passes on a machine that happens to have it: the "green on my machine" trap this repo keeps
# hitting. Depending on `attest[bench]` keeps sklearn OUT of the runtime `dependencies` (the
# service still does not ship it) while guaranteeing the tier that imports it can install it.
# ruff is PINNED exact, not floored. The lint gate is part of CI (`just check`), and ruff's
# rule set moves between releases -- a rule can be added, deprecated, or removed (UP038, which
# once flagged `isinstance(x, (int, float))`, was removed outright by 0.15). An unpinned floor
# means the same tree lints clean on one machine and red on another with no code change: the
# "green on my machine" trap this repo keeps hitting. Bump it deliberately, with `ruff check .`
# clean, or not at all.
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff==0.15.21", "attest[bench]"]
# The benchmark's metrics. sklearn, not a hand-rolled count: the arithmetic of a metric is
# exactly where a quiet off-by-one produces a plausible number that is wrong, and a
# benchmark's own arithmetic is the last thing that should be bespoke. NOT a runtime
# dependency -- nothing in src/attest imports it, and the service does not ship it. Pulled
# into `dev` above because the offline test tier (test_benchmark.py) imports it.
bench = ["scikit-learn>=1.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "seed", "spikes", "tests", "benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ is on the path so `from conftest import DOCUMENTED` works: the seeded URNs
# are a shared vocabulary, and naming them by the role they play beats repeating URN
# literals in every assertion.
pythonpath = ["tests"]
# Live tests hit the real OpenAI API and cost money, so they are deselected by default.
# `just live` runs them. The default selection still includes the INTEGRATION tier (live
# GMS, no model cost); `just check`/CI narrows further to `not live and not integration`.
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: real OpenAI model AND/OR the anti-drift pin against live GMS. Costs money / needs a catalog. Run with `just live`.",
    "integration: needs a live DataHub server (wire format, structured-property fabrication). No model cost, but not offline. Skips LOUDLY when DataHub is down.",
]
