</g>
<g font-family="Verdana,'DejaVu Sans',Geneva,sans-serif" font-size="11" text-anchor="middle">
  <text x="29.0" y="14" fill="#D2D6DC">license</text>
  <text x="103.0" y="14" fill="#0A0B0D" font-weight="600">Apache-2.0</text>
