<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- REAL FILES, in frontend/public/. Vite copies that directory verbatim into dist/,
         which the FastAPI app static-mounts at "/" (api/app.py), so the demo serves them
         from its own origin and no runtime CDN is involved — same discipline as the
         self-hosted fonts in index.css.
         This replaced an inline data: favicon of the three verdict colours, which was itself
         a stopgap for the scaffold's dangling `href="/vite.svg"` — a claim about a file that
         was not there, 404'ing on every page load until the browser E2E found it. The href
         below is only honest while public/ holds these names, and NOTHING asserts that: no
         test fetches an icon, so a rename here fails silently and must be checked by hand
         against the running server.
         Note also that the mark is monochrome BY RULE (assets/brand/BRAND.md): the identity
         never carries a verdict colour, which is what the old dot favicon did. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attest — Groundedness Auditor</title>
    <meta
      name="description"
      content="Attest verifies what an AI agent claims about your data against the DataHub catalog, with zero verdicts decided by a model."
    />
    <!-- A link-preview scraper needs an ABSOLUTE og:image URL and this demo runs
         per-judge-local with no domain, so the relative path is correct for the mounted
         build and a hosted deployment would prefix its origin. Stated rather than left as a
         path that silently resolves to nothing off-origin. -->
    <meta property="og:title" content="Attest — Groundedness Auditor" />
    <meta property="og:image" content="/attest-social-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
