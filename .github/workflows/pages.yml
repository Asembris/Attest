# Pages: publish docs/ from a workflow this repo owns, instead of the managed one.
#
# WHY THIS EXISTS — measured, not preferred. GitHub's auto-generated "pages build and
# deployment" workflow calls actions/deploy-pages with its DEFAULT `timeout` of 600000 ms,
# and that value cannot be changed from the repository. On 2026-08-06 two consecutive
# deployments sat in `deployment_queued` past ten minutes and were aborted by it:
#
#   #17  a253f0d  11:33Z  success (4 min)
#   #18  8c08001  12:15Z  FAILED — touched only tests/fixtures/, nothing under docs/
#   #19  b5947bf  12:45Z  FAILED — the video-id commit
#
# Run #18 is the load-bearing evidence: BYTE-IDENTICAL Pages content deployed at 11:33 and
# failed at 12:15. The cause is therefore not repo content, and no commit could have fixed
# it — GitHub Status reported Pages operational throughout, and a re-run failed the same
# way. What a workflow we own can change is the one thing the managed one hard-codes: how
# long to wait before giving up on a backend queue that is slow rather than stuck.
#
# It is deliberately NOT a retry. A retry would re-queue a fresh deployment and start the
# wait over; raising the timeout waits out the deployment already accepted. If the backend
# is genuinely stuck rather than slow this still fails — correctly, and in bounded time.
#
# REQUIRES: Settings -> Pages -> Source = "GitHub Actions". While the source is still
# "Deploy from a branch" this workflow cannot publish (there is no Actions-enabled Pages
# site for configure-pages to configure) and the managed workflow keeps running in its
# place. Flipping that setting is what retires the managed workflow — there is no file to
# delete, because it was never in the repo.
#
# NOTE this also removes Jekyll from the path entirely: an uploaded artifact is served
# verbatim, with no build step. docs/replay/ is a committed Vite bundle held byte-exact by
# .gitattributes (`docs/replay/** -text`), so "served exactly as committed" is the property
# it already depends on. A `.nojekyll` marker is therefore unnecessary here rather than
# merely absent.
name: pages

on:
  push:
    branches: [main]
    # Only docs/ is published, so only docs/ (and this file) can change what is served.
    # Every other push would redeploy identical bytes and spend a Pages build against the
    # per-hour soft limit for nothing.
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # Redeploy on demand — the remedy for a timed-out deploy is to run it again, and this is
  # what makes that possible without an empty commit on a history that is reviewed linearly.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and NEVER cancel one in flight: cancelling mid-publish is how a
# site ends up half-swapped, and the failure this workflow exists for is precisely a deploy
# that needs longer than usual. Queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Backstop above the action's own 30-minute wait below, so a wedged job cannot idle for
    # the 6-hour default. The action should always be the thing that gives up first.
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: 📦 Package docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          # v5 EXCLUDES dotfiles by default. docs/ has none today, so this is a no-op —
          # it is set because the failure mode if one is ever added is a file that vanishes
          # from the published site silently, with a green tick on the run that dropped it.
          include-hidden-files: true

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # 30 minutes, against the managed workflow's fixed 10. The two aborted runs above
          # were still `deployment_queued` at the 10-minute mark; this waits the backend out
          # rather than declaring a slow queue dead. Bounded on purpose — a deploy that
          # never finishes must still fail, not hang.
          timeout: 1800000
