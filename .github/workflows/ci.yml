# CI: the truly-offline tier, on every push. No DataHub, no OpenAI key.
#
# This gate exists ONLY because Session 8 made the offline tier truly offline: the checkers,
# the benchmark, the coverage matrix and — the load-bearing one — the vacuity check
# (test_breaking_a_checker_collapses_the_benchmark) all read captured fixtures instead of a
# live catalog, so they run on a bare runner and never skip. Before that split, half of them
# would have skipped here and the gate would have been green about a smaller program.
#
# It runs `just check` verbatim, so CI runs exactly what a developer runs locally — lint plus
# the offline tier. The integration tier (live GMS) and the live tier (real model) are NOT
# run here: they need servers and a paid key, and the cadence rule keeps them on `just live`
# / `just preflight` before a push to the semantic layer.
#
# The output of that one command is tee'd and rendered into a receipts panel on the run's
# summary page (.github/scripts/ci_summary.py). The panel is DECORATION — the gate is the
# step's exit code, which the summary never touches — so it cannot paint a red run green.
name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: extractions/setup-just@v4

      - name: 📦 Install package and dev dependencies
        run: just setup

      # lint + the truly-offline test tier (`-m 'not live and not integration'`), across
      # cores. No network: if any "offline" test reaches for DataHub, it fails here rather
      # than skipping — which is the whole point of the gate. Tee'd so the summary step can
      # read the tally; the explicit `shell: bash` below turns pipefail ON (the implicit
      # default does NOT), so `just check`'s failure stays the pipeline's exit code and the
      # tee cannot mask it.
      - name: ✅ Lint and run the offline tier
        id: check
        # `shell: bash` is REQUIRED, not stylistic. The IMPLICIT default on a Linux runner is
        # `bash -e {0}` — no pipefail — so `just check 2>&1 | tee` exits with tee's 0 even when
        # `just check` is RED, and a failing gate reports GREEN: a green light wired to nothing,
        # in the repo's own CI. Naming the shell EXPLICITLY selects `bash --noprofile --norc -eo
        # pipefail {0}`, which turns pipefail on, so `just check`'s exit code becomes the
        # pipeline's exit code and the tee cannot mask a failure.
        shell: bash
        run: just check 2>&1 | tee check-output.txt

      # Render the run as a receipts panel on the summary page. `always()` so it also reports
      # a FAILED run (the most useful time to see the counts); the banner reflects the real
      # step outcome, never the parse.
      - name: 📊 Job summary
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: python .github/scripts/ci_summary.py
