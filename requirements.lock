# Attest RUNTIME lock — the full, pinned transitive closure of the service.
#
# This is what a deployed or clone-and-run instance installs, and it is the reproducibility
# guarantee `requirements.txt` (direct pins only) could not give: every transitive version
# is fixed too, so the same tree resolves to the same bytes on any machine. Without it, a
# transitive dep floats and a deployed instance drifts while every local test stays green —
# the "green on my machine" trap this repo keeps closing.
#
# SCOPE, stated so nobody assumes more:
#   * RUNTIME ONLY. This is `pip install .` (the service). It does NOT include the dev tier
#     (pytest, ruff, sklearn), the seed/ingestion tooling (acryl-datahub, a very large tree
#     of its own), or the e2e extra (Playwright). Those are installed on top and keep their
#     own pins: ruff and playwright are pinned EXACT in pyproject; the seed pins live in
#     requirements.txt. Keeping the e2e extra OUT of this lock is deliberate — CI and the
#     default install must never pull Playwright (see pyproject `[e2e]`).
#   * VERSIONS ARE THE TESTED ONES, not a fresh resolution. Captured from the working venv
#     where the suite passes, so the lock records what actually works — not whatever the
#     resolver would pick from the floors today (which drifted newer: fastapi 0.139.2,
#     pydantic 2.13.4, measured 2026-07-18).
#   * NO HASHES. Version-pinned, not hash-pinned — a real improvement over floating floors
#     without adding pip-tools to the tree. A production deployment that needs supply-chain
#     hash verification would regenerate this with `pip-compile --generate-hashes`.
#
# Regenerate: install `.` into a clean venv and freeze its non-editable closure, then pin
# each name to the version in the tested venv. See docs/deployment.md.
#
# Install:  pip install -r requirements.lock  (runtime)   then  .[dev] / .[e2e] as needed.

